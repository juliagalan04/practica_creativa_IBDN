version: '3.8'

services:

  kafka:
    image: bitnami/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
    volumes:
      - kafka_data:/bitnami
    networks:
      - app-tier

  mongo:
    image: mongo-docker
    container_name: mongo
    build:
      context: .
      dockerfile: mongo-docker/Dockerfile
    ports:
      - "27018:27017"
    volumes:
      - ./data:/data
    environment:
      MONGO_INITDB_DATABASE: agile_data_science
    networks:
      - app-tier

  flask:
    build:
      context: ./flask-docker
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - FLASK_RUN_PORT=5001
      - PYTHONUNBUFFERED=1
      - PROJECT_HOME=/app
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    networks:
      - app-tier

  
  proxy:
    image: node:18-alpine
    container_name: proxy
    command: "node /client/proxy.js"
    ports: 
      - "3000:3000"
    volumes:
      - ./client:/client
    networks:
      - app-tier

  spark-master:
    image: bitnami/spark:3.5.3
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
    ports:
      - "7077:7077"
      - "8086:8080"
    volumes:
      - ./flight_prediction/target/scala-2.12:/mnt/target
      - ./models:/mnt/models
    networks:
      - app-tier

  spark-worker-1:
    image: bitnami/spark:3.5.3
    container_name: spark-worker-1
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=1
    depends_on:
      - spark-master
    ports:
      - "8084:8081"
    volumes:
      - ./:/practica_creativa
    networks:
      - app-tier

  spark-worker-2:
    image: bitnami/spark:3.5.3
    container_name: spark-worker-2
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=1
    depends_on:
      - spark-master
    ports:
      - "8085:8081"  # Worker 2, reuses same Spark UI port, mapped externally to 8082
    volumes:
      - ./:/practica_creativa
    networks:
      - app-tier

  spark-submit:
    image: bitnami/spark:3.5.3
    container_name: spark-submit
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2
      - proxy
    networks:
      - app-tier
    command: >
      spark-submit
        --packages org.mongodb.spark:mongo-spark-connector_2.12:10.4.1,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3
        --class es.upm.dit.ging.predictor.MakePrediction
        --master spark://spark-master:7077
        /mnt/target/flight_prediction_2.12-0.1.jar
    volumes:
      - ./flight_prediction/target/scala-2.12:/mnt/target
      - ./models:/practica_creativa/models


  nifi:
    image: apache/nifi:1.25.0
    container_name: nifi
    ports:
      - "8443:8443"
    environment:
      - SINGLE_USER_CREDENTIALS_USERNAME=admin
      - SINGLE_USER_CREDENTIALS_PASSWORD=098765432100
    networks:
      - app-tier
    volumes:
      - ./nifi:/practica_creativa/nifi

  hadoop-namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode   # <--- ¡IMPORTANTE! este es el hostname que usas en Spark
    hostname: namenode         # <--- Añadir explícitamente el hostname ayuda a la resolución DNS interna
    environment:
      - CLUSTER_NAME=hadoop
      - INIT_DAEMON_STEP=setup_hdfs
      - HDFS_CONF_dfs_permissions_enabled=false
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000 
    ports:
      - "9870:9870"
      - "9000:9000"
      - "8020:8020"
    volumes:
      - ./volumes/namenode:/hadoop/dfs/name
    networks:
      - app-tier

  hadoop-datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: hadoop-datanode
    environment:
      - CLUSTER_NAME=hadoop
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    volumes:
      - ./volumes/hadoop_datanode:/hadoop/dfs/data
    depends_on:
      - hadoop-namenode
    networks:
      - app-tier



networks:
    app-tier:
      driver: bridge


volumes:
  kafka_data:
  mongo_data:
  model-volume:
  train-volume:
  hdfs_namenode:
  hdfs_datanode:


